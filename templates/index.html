
<!DOCTYPE html>
<html>
<head>
    <title> Personalized Debugging Assistant </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .chat-container {
            width: 1000px;
            margin: 40px auto;
            background: black;
            border-radius: 10px;
            padding: 50px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .messages {
            display: flex;
		    flex-direction: column;
            height: 400px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
            word-wrap: break-word;
		    overflow-wrap: break-word;
        }
        .message {        
            display: block;
		    margin: 10px 0;
		    max-width: 80%;
        }
        .user {
        	align-self: flex-start; 
            color: blue;            
			background: #e3f2fd;
			padding: 20px;
			border-radius: 10px;
			display: inline-block;
			max-width: 80%;
        }
        .bot {
	        align-self: flex-end; 
            color: green;
			background: #e8f5e9;
			padding: 20px;
			border-radius: 10px;
			display: inline-block;
			max-width: 80%;
        }
        .thinking {
	        align-self: flex-end; 
	        color: white;
			font-weight: bold;
			padding: 20px;
			border-radius: 10px;
			display: inline-block;
			max-width: 80%;
        }
        .input-box {
            display: flex;
        }
        input {
            flex: 1;
            padding: 10px;
        }
        button {
            padding: 10px;
        }
        .feedback {
            margin-top: 5px;
        }
        .header{
        	color: White
        }
        textarea {
			flex: 1;
			padding: 10px;
			resize: none;         
			border-radius: 5px;
			border: 1px solid #ccc;
		}
		.selected-up {
    		color: green;
		}

		.selected-down {
			color: red;
		}
    </style>
</head>
<body>

<div class="chat-container">
    <h2 class="header">Personal Debugging Assistant</h2>
    <div class="messages" id="messages"></div>


    <div class="input-box">
    	<button style="margin:auto;display:block;width:30px; height:60px;" onclick="document.getElementById('fileInput').click()">+</button>
    	<input type='file' id="fileInput" style="display:none">	    
		<textarea id="question" placeholder="Ask a debugging question..." rows="4"></textarea>		
		<button onclick="sendMessage()">Send</button>

	</div>
</div>

<script>

document.getElementById("question").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();  // prevents newline / form submit
        sendMessage();
    }
});

let sessionId = localStorage.getItem("session_id");
if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem("session_id", sessionId);
}

function formatCode(text) {
    return text.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
}

function formatText(text) {
	text = formatCode(text);
    return text.replace(/\n/g, "<br>");
}

function addThinkingMessage() {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message thinking";
    msgDiv.id = "thinking-message";

    const content = document.createElement("div");
    content.innerHTML = "<br> Thinking <br> <img src='{{ url_for('static', filename='images/thinking.png') }}' alt ='...Thinking...' style='width: 150px; height: 150px;' />";

    msgDiv.appendChild(content);

    const messages = document.getElementById("messages");
    messages.appendChild(msgDiv);
    messages.scrollTop = messages.scrollHeight;

    return msgDiv;
}
async function sendMessage() {
    const input = document.getElementById("question");
    const fileInput = document.getElementById("fileInput");

    const text = input.value;
    const file = fileInput.files[0];

    if (!text && !file) return;

    addMessage(text || ```Uploaded item: ${file.name}```, "user");

    input.value = "";
    fileInput.value = "";
	const thinkingMsg = addThinkingMessage();
	
    const formData = new FormData();
    formData.append("question", text);
    formData.append("session_id", sessionId);

    if (file) {
        formData.append("file", file);
    }
	
    const res = await fetch("/ask", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    thinkingMsg.remove();
    addBotMessage(data.answer, data.id);
}

function addMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message " + sender;
    msgDiv.innerHTML = formatText(text);
    const messages = document.getElementById("messages");
    messages.appendChild(msgDiv);
	messages.scrollTop = messages.scrollHeight;
}

function addBotMessage(text, id) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "message bot";

    const content = document.createElement("div");
    content.innerHTML = formatText(text);

    const feedback = document.createElement("div");
    feedback.className = "feedback";

    const up = document.createElement("button");
    up.dataset.id = id;

    up.innerHTML = "Better?";
	up.onclick = (e) => {
							sendFeedback(e.target.dataset.id, true);
							e.target.classList.add("selected-up");
							up.innerText="Saved";
							up.disabled=true;
							down.disabled=true;
						};

    const down = document.createElement("button");
   	down.dataset.id = id;
   	
    down.innerHTML = "Still trying?";
	down.onclick = (e) => {
							sendFeedback(e.target.dataset.id, false);
							e.target.classList.add("selected-down");
							down.innerText="Saved";
							up.disabled=true;
							down.disabled=true;

							};

    feedback.appendChild(up);
    feedback.appendChild(down);

    msgDiv.appendChild(content);
    msgDiv.appendChild(feedback);

    document.getElementById("messages").appendChild(msgDiv);
}

async function sendFeedback(id, success) {
    await fetch("/feedback", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id: id, success: success})
    });



}
</script>

</body>
</html>
